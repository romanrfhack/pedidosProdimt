name: Build and tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NG_CLI_ANALYTICS: 'false'
  CI: 'true'

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        id: dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Select installed .NET 10 SDK
        env:
          TEST_DOTNET_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$TEST_DOTNET_VERSION" --roll-forward latestPatch
      - name: Restore
        run: dotnet restore src/Prodimt.Pedidos.sln --disable-parallel -m:1 -nr:false
      - name: Build
        run: dotnet build src/Prodimt.Pedidos.sln --configuration Release --no-restore -m:1 -nr:false -p:UseSharedCompilation=false
      - name: Test (SQLite and in-memory fixtures)
        run: dotnet test src/Prodimt.Pedidos.sln --configuration Release --no-build --no-restore -m:1 -nr:false
      - name: Restore EF tools
        run: dotnet tool restore
      - name: Check migration matches the model
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Prodimt.Pedidos.Infrastructure --startup-project src/Prodimt.Pedidos.Api --configuration Release --no-build
      - name: Generate SQL Server script without applying it
        run: dotnet tool run dotnet-ef migrations script --idempotent --project src/Prodimt.Pedidos.Infrastructure --startup-project src/Prodimt.Pedidos.Api --configuration Release --no-build --output "$RUNNER_TEMP/pilot-migrations.sql"

  sqlserver:
    name: SQL Server migrations and transactional HTTP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        id: dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Select installed .NET 10 SDK
        env:
          TEST_DOTNET_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$TEST_DOTNET_VERSION" --roll-forward latestPatch
      - name: Start disposable SQL Server with a generated password
        shell: bash
        run: |
          set -euo pipefail
          test_sql_password="$(openssl rand -hex 24)Aa1!"
          printf '::add-mask::%s\n' "$test_sql_password"
          test_sql_connection="Server=127.0.0.1,14333;Database=master;User Id=sa;Password=$test_sql_password;Encrypt=True;TrustServerCertificate=True"
          printf '::add-mask::%s\n' "$test_sql_connection"
          printf 'PRODIMT_SQL_TEST_CONNECTION=%s\n' "$test_sql_connection" >> "$GITHUB_ENV"
          docker run --detach --rm --name prodimt-i02-sqlserver \
            --publish 127.0.0.1:14333:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_MEMORY_LIMIT_MB=2048 \
            --env MSSQL_SA_PASSWORD="$test_sql_password" \
            mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            if docker exec prodimt-i02-sqlserver /opt/mssql-tools18/bin/sqlcmd \
                -C -S localhost -U sa -P "$test_sql_password" -Q 'SELECT 1' -b >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          printf 'SQL Server did not become ready within 120 seconds.\n' >&2
          exit 1
      - name: Verify native inventory JSON with real sqlcmd
        run: python3 tests/pilot/verify_sqlcmd_json.py
      - name: Restore SQL integration tests
        run: dotnet restore tests/Prodimt.Pedidos.SqlServer.Tests/Prodimt.Pedidos.SqlServer.Tests.csproj --disable-parallel -m:1 -nr:false
      - name: Test migrations, durable retries, rollback and corrections on SQL Server
        run: dotnet test tests/Prodimt.Pedidos.SqlServer.Tests/Prodimt.Pedidos.SqlServer.Tests.csproj --configuration Release --no-restore -m:1 -nr:false -p:UseSharedCompilation=false --logger 'console;verbosity=normal'
      - name: Verify native migration scripts with actual ODBC sqlcmd
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet tool run dotnet-ef migrations script 0 20260528131416_AddCatalogExternalCodesAndImportSupport --idempotent --project src/Prodimt.Pedidos.Infrastructure --startup-project src/Prodimt.Pedidos.Api --configuration Release --no-build --output "$RUNNER_TEMP/native-cli-baseline.sql"
          dotnet tool run dotnet-ef migrations script 0 20261024202253_AddOrderChangeNotices --idempotent --project src/Prodimt.Pedidos.Infrastructure --startup-project src/Prodimt.Pedidos.Api --configuration Release --no-build --output "$RUNNER_TEMP/native-cli-migrations.sql"
          python3 tests/pilot/verify_native_sqlcmd_migration.py --baseline "$RUNNER_TEMP/native-cli-baseline.sql" --script "$RUNNER_TEMP/native-cli-migrations.sql"
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm --force prodimt-i02-sqlserver || true

  frontend:
    name: Angular build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/prodimt-pedidos-web/package-lock.json
            tests/e2e/package-lock.json
      - name: Install frontend dependencies from lockfile
        run: npm ci
        working-directory: apps/prodimt-pedidos-web
      - name: Audit frontend and build dependencies
        run: npm audit --audit-level=high
        working-directory: apps/prodimt-pedidos-web
      - name: Build frontend
        run: npm run build
        working-directory: apps/prodimt-pedidos-web
      - name: Install test dependencies from lockfile
        run: npm ci
        working-directory: tests/e2e
      - name: Audit browser test dependencies
        run: npm audit --audit-level=high
        working-directory: tests/e2e
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Browser tests (local mock API)
        id: browser-tests
        run: npm test -- --workers=1 --reporter=line
        working-directory: tests/e2e
      - name: Preserve browser failure diagnostics (fictional mock data only)
        if: failure() && steps.browser-tests.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: warn

  pilot-package:
    name: Production package and isolated pilot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify VPS inventory and isolated Nginx publication guards
        run: python3 -m unittest discover -s tests/pilot -v
      - name: Exercise configuration files extracted with private permissions
        run: chmod 600 src/Prodimt.Pedidos.Api/appsettings*.json
      - name: Build and exercise a disposable production stack with fictional data
        run: bash scripts/pilot/smoke-compose.sh
